<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Pagamento da TMT | Fogão da Vovó</title><link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/all.min.css"><link rel="stylesheet" href="css/pagamento.css?v=20261031-imagekit1">
<style>.tmt-form{padding:18px;background:#fff;border-radius:18px;margin:16px}.tmt-form label{display:block;margin:12px 0;font-size:13px}.tmt-form input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit;margin-top:5px}.tmt-message{margin:16px;line-height:1.6}.tmt-success{padding:24px;background:#ecf8ef;border-radius:16px;color:#18813b;text-align:center;margin:16px}#tmt-qr{max-width:100%;height:auto}#tmt-code{overflow-wrap:anywhere}</style>
<script src="js/meta-tracking.js" defer></script><script src="js/pix-config.js?v=20261031-session1" defer></script><script src="js/payment-session.js?v=20261031-session2" defer></script><script src="js/qrcode-generator.js" defer></script><script src="js/qrcode-utf8.js" defer></script><script src="js/pagamento-tmt.js?v=20261031-server2" defer></script>
</head><body><div class="payment-page">
<header class="payment-header"><a href="tmt.html" id="tmt-back" aria-label="Voltar"><i class="fa-solid fa-arrow-left"></i></a><div><strong>Pagamento PIX</strong><span>Taxa de Manipulação e Transporte</span></div><i class="fa-solid fa-lock" aria-hidden="true"></i></header>
<main><section class="payment-intro"><div class="pix-title"><i class="fa-brands fa-pix"></i> Pagar com Pix</div><div class="payment-total">R$ 9,90</div><span class="payment-pending" id="tmt-payment-status">Preparando seu PIX…</span></section>
<p id="tmt-message" class="tmt-message" role="status"></p><button id="tmt-retry" class="copy-button" type="button" hidden>TENTAR NOVAMENTE</button>
<form id="tmt-customer" class="tmt-form" hidden><p>Confirme seus dados para gerar o PIX da TMT.</p>
<label>Nome completo<input id="tmt-name" autocomplete="name" maxlength="120" required></label>
<label>E-mail<input id="tmt-email" type="email" autocomplete="email" maxlength="254" required></label>
<label>Telefone<input id="tmt-phone" type="tel" autocomplete="tel" maxlength="20" required></label>
<label>CPF<input id="tmt-cpf" inputmode="numeric" maxlength="14" required></label>
<button class="copy-button" id="tmt-generate" type="submit">GERAR PIX DE R$ 9,90</button></form>
<section id="tmt-pix" class="payment-panel" hidden><div class="qr-frame"><img id="tmt-qr" alt="QR Code PIX da TMT" hidden></div><div class="camera-note">Aponte a câmera do app do banco</div><div id="tmt-code" class="pix-code"></div><button id="tmt-copy" class="copy-button" type="button">COPIAR CÓDIGO PIX</button><p id="tmt-copy-status" class="pix-copy-status" role="status"></p><p class="payment-note">Taxa de Manipulação e Transporte · R$ 9,90</p></section>
<section id="tmt-success" class="tmt-success" role="status" hidden><strong>Pagamento da TMT confirmado!</strong><p>Recebemos a confirmação do seu Pix de R$ 9,90.</p></section>
</main></div></body></html>
