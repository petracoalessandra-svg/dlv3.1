name = "marmita"
main = "worker.mjs"
compatibility_date = "2026-10-27"

[observability]
enabled = true

[build]
command = "node generate-catalog.cjs"

# Use * para permitir qualquer origem ou informe origens específicas separadas por vírgulas.
[vars]
ALLOWED_ORIGINS = "*"
SUPABASE_URL = "https://cvbpvsiiofwdpkohxqgq.supabase.co"

[[kv_namespaces]]
binding = "PAYMENT_SESSIONS"
id = "0c886a7975434902bdd5a7bb54d0071f"

[[secrets_store_secrets]]
binding = "META_ACCESS_TOKEN"
store_id = "5a5cc7d3f4e648beb56f3fcab5000bb6"
secret_name = "META_ACCESS_TOKEN"

[[ratelimits]]
name = "PIX_STATUS_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "PIX_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[durable_objects.bindings]]
name = "PIX_REQUESTS"
class_name = "PixRequest"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PixRequest"]

[[ratelimits]]
name = "META_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
